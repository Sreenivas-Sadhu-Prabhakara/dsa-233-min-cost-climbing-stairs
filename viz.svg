<text x="56.0" y="79.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Pay cost[i] when JUMPING FROM step i (1 or 2 steps); start at step 0 or 1; reach</text>
<text x="56.0" y="98.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">past the end. Costs [10,15,20]: best is start at 15, jump two — total 15.</text>
