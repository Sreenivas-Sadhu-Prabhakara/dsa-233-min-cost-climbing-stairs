<text x="56.0" y="197.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">dp[i] = cheapest total to STAND past step i's departure = cost[i] + min(dp[i+1],</text>
<text x="56.0" y="216.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">dp[i+2]) — or forward: reach[i] = min(reach[i−1]+cost[i−1], reach[i−2]+cost[i−2]).</text>
